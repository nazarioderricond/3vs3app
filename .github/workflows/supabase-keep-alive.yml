name: Keep Supabase Database Active

on:
  schedule:
    # Run every 2 days at 12:00 UTC
    - cron: '0 12 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (Heartbeat)
        run: |
          echo "Sending keep-alive ping to Supabase..."
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://etbpjlpbzvqcpphsywgu.supabase.co/rest/v1/seasons?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0YnBqbHBienZxY3BwaHN5d2d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzYxODQsImV4cCI6MjA3OTU1MjE4NH0.8NkLYP-bddMIr8j214H3awNJNqsR_Aq89gAU-H6XTCM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0YnBqbHBienZxY3BwaHN5d2d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzYxODQsImV4cCI6MjA3OTU1MjE4NH0.8NkLYP-bddMIr8j214H3awNJNqsR_Aq89gAU-H6XTCM")
          
          echo "Supabase HTTP Response Code: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -eq 200 ] || [ "$RESPONSE_CODE" -eq 206 ]; then
            echo "✅ Heartbeat successful! Supabase DB activity refreshed."
          else
            echo "⚠️ Unexpected response code: $RESPONSE_CODE"
            exit 1
          fi
